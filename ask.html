---
layout: default
title: Ask Me Anything
---

<div class="ask-page">
  <h2>Ask Me Anything</h2>
  <p>Have a question? Feel free to reach out!</p>
  
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="ask-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="_replyto" required>
    </div>
    
    <div class="form-group">
      <label for="question">Question</label>
      <textarea id="question" name="message" rows="6" required></textarea>
    </div>
    
    <button type="submit">Send Question</button>
  </form>
</div>

<style>
.ask-page h2 {
  font-size: 1.5rem;
  margin-bottom: 15px;
}

.ask-page > p {
  margin-bottom: 30px;
  color: #666;
}

.ask-form {
  max-width: 500px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 5px;
  font-weight: 500;
  font-size: 0.9rem;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 3px;
  font-family: inherit;
  font-size: 1rem;
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #999;
}

.ask-form button {
  background-color: #000;
  color: #fff;
  padding: 10px 25px;
  border: none;
  border-radius: 3px;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.ask-form button:hover {
  background-color: #333;
}
</style>
