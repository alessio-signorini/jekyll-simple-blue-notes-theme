---
layout: default
---

<div class="posts">
  {% for post in site.posts limit:5 %}
    <article class="post">
      <h2 class="post-title">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h2>
      
      <div class="post-excerpt">
        {{ post.content }}
      </div>

      <footer class="post-meta">
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y (%l:%M %p)" | upcase }}</time>
        {% if post.tags %}
          <span class="post-tags">
            {% for tag in post.tags %}
              <a href="{{ '/tagged/' | append: tag | downcase | replace: ' ', '%20' | relative_url }}" class="tag"># {{ tag | upcase }}</a>
            {% endfor %}
          </span>
        {% endif %}
      </footer>
    </article>
  {% endfor %}
</div>

<nav class="pagination">
  <a href="{{ '/page/2' | relative_url }}" class="pagination-next">NEXT PAGE</a>
  <a href="{{ '/archive' | relative_url }}" class="pagination-archive">ARCHIVE</a>
</nav>
