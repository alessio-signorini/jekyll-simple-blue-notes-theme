---
layout: default
---

<article class="post">
  <h2 class="post-title">
    <a href="{{ page.url | relative_url }}">{{ page.title }}</a>
  </h2>
  
  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-meta">
    {% if page.tags %}
      <span class="post-tags">
        {% for tag in page.tags %}
          <a href="{{ '/tagged/' | append: tag | downcase | replace: ' ', '%20' | relative_url }}" class="tag"># {{ tag | upcase }}</a>
        {% endfor %}
      </span>
    {% endif %}
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y (%l:%M %p)" | upcase }}</time>
  </footer>
</article>
